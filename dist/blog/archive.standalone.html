<!--
  Campus Mind – Blog Archive by Month
  Paste this whole block into a Custom HTML / code block on the /blog/ page
  (place it at the very bottom of the page content).

  Layout options (change data-layout on the div below):
    auto    (default) inline block at the bottom on normal/small screens; on wide
            screens (>= 1360px) the same block becomes a fixed right-hand panel.
    inline  bottom of page only, all screen sizes
    sidebar right-hand panel only (wide screens); hidden on small screens
-->

<div id="cm-archive" class="cm-archive" data-layout="auto"
     data-sitemap="/post-sitemap.xml" data-open-latest="true">
  <div class="cm-archive__head">
    <h2 class="cm-archive__title">Blog Archive</h2>
    <div class="cm-archive__tools">
      <button type="button" class="cm-archive__btn" data-cm="expand">Expand all</button>
      <button type="button" class="cm-archive__btn" data-cm="collapse">Collapse all</button>
    </div>
  </div>
  <p class="cm-archive__status" role="status" aria-live="polite">Loading archive…</p>
  <div class="cm-archive__list"></div>
  <noscript>
    <p><a href="/post-sitemap.xml">Browse every Campus Mind blog post (sitemap)</a></p>
  </noscript>
</div>

<style>
  .cm-archive {
    --cm-fg: #1f2933;
    --cm-muted: #616e7c;
    --cm-line: #e4e7eb;
    --cm-bg: #ffffff;
    --cm-accent: #2f6fed;
    --cm-hover: #f5f7fa;
    box-sizing: border-box;
    max-width: 960px;
    margin: 48px auto 32px;
    padding: 24px;
    background: var(--cm-bg);
    color: var(--cm-fg);
    border: 1px solid var(--cm-line);
    border-radius: 12px;
    font-size: 16px;
    line-height: 1.5;
    font-family: inherit;
  }
  .cm-archive *, .cm-archive *::before, .cm-archive *::after { box-sizing: border-box; }
  .cm-archive__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .cm-archive__title { margin: 0; font-size: 1.35rem; line-height: 1.3; }
  .cm-archive__tools { display: flex; gap: 8px; }
  .cm-archive__btn {
    appearance: none; background: transparent; color: var(--cm-accent);
    border: 1px solid var(--cm-line); border-radius: 999px; padding: 4px 12px;
    font: inherit; font-size: .85rem; cursor: pointer;
  }
  .cm-archive__btn:hover { background: var(--cm-hover); }
  .cm-archive__btn:focus-visible, .cm-archive summary:focus-visible, .cm-archive a:focus-visible {
    outline: 2px solid var(--cm-accent); outline-offset: 2px;
  }
  .cm-archive__status { margin: 4px 0 12px; color: var(--cm-muted); font-size: .9rem; }
  .cm-archive__status:empty { display: none; }
  .cm-archive__year {
    margin: 20px 0 6px; font-size: .8rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--cm-muted);
  }
  .cm-archive details { border-top: 1px solid var(--cm-line); }
  .cm-archive details:last-of-type { border-bottom: 1px solid var(--cm-line); }
  .cm-archive summary {

  .cm-archive summary::-webkit-details-marker { display: none; }
  .cm-archive summary:hover { background: var(--cm-hover); }
  .cm-archive summary::after {
    content: ""; flex: 0 0 auto; width: 8px; height: 8px;
    border-right: 2px solid var(--cm-muted); border-bottom: 2px solid var(--cm-muted);
    transform: rotate(45deg); transition: transform .15s ease;
  }
  .cm-archive details[open] > summary::after { transform: rotate(-135deg); }
  .cm-archive__count {
    margin-left: auto; margin-right: 4px; font-weight: 400; font-size: .85rem; color: var(--cm-muted);
  }
  .cm-archive ul { list-style: none; margin: 0; padding: 0 8px 12px; }
  .cm-archive li { margin: 0; padding: 6px 0; }
  .cm-archive li a { color: var(--cm-accent); text-decoration: none; }
  .cm-archive li a:hover { text-decoration: underline; }
  .cm-archive li time { display: block; font-size: .8rem; color: var(--cm-muted); }

  @media (prefers-reduced-motion: reduce) { .cm-archive summary::after { transition: none; } }

  /* Wide screens: sticky right-hand panel (layout = auto | sidebar) */
  @media (min-width: 1360px) {
    .cm-archive[data-layout="auto"],
    .cm-archive[data-layout="sidebar"] {
      position: fixed; top: 110px; right: 20px; width: 300px; max-height: calc(100vh - 140px);
      margin: 0; padding: 16px; overflow-y: auto; z-index: 50;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
  }
  /* Narrow screens: sidebar-only layout is hidden */
  @media (max-width: 1359px) {
    .cm-archive[data-layout="sidebar"] { display: none; }
  }
</style>

plete Guide\n8-dimensions-of-wellness-college|2025-11-26|8 Dimensions of Wellness in College: Your Complete Success Guide\nsupporting-college-student-mental-health-distance-parent-guide|2025-11-20|Supporting Your College Student's Mental Health from Afar: A Parent's Guide\nfreshman-year-college-tips-survival-guide|2025-11-18|Freshman Year College Tips: 10 Proven Ways to Thrive and Avoid Becoming a Dropout Statistic\ncollege-student-financial-wellness|2025-11-14|College Student Financial Wellness: Reduce Stress & Boost Success\nsupport-student-parents-college|2025-11-12|How to Support Student Parents in College: Proven Strategies for Success\nstop-out-students-re-enrollment-strategies|2025-11-06|Re-engaging the Stopped-Out: How to Bring Students Back\nfirst-generation-student-retention-strategies-equity-gaps|2025-11-04|First-Generation Student Retention Strategies That Close Equity Gaps\nstudent-retention-strategies-2035|2025-10-31|Student Retention Strategies for 2035: AI, Hybrid Models & Equity\nstudent-burnout-prevention-strategies|2025-10-29|Student Burnout Prevention Strategies: Balancing Rigor and Support\none-stop-student-services|2025-10-27|One Stop Student Services: Why Combining Services Boosts Student Success\ncampus-mental-health-programs-resilience|2025-10-23|Campus Mental Health Programs That Build Student Resilience\ncollege-student-basic-needs-insecurity|2025-10-21|Beyond Academics: Addressing College Student Basic Needs Insecurity\nstudent-engagement-analytics-participation-data-retention|2025-10-18|Student Engagement Analytics: Turning Participation Data Into Retention Results\nai-chatbots-in-student-advising|2025-10-11|AI Chatbots in Student Advising: Real Benefits and Honest Limitations\nintegrated-student-support-systems|2025-10-07|From Portals to Platforms: Integrating Student Support Systems\nuniversity-student-success|2025-10-03|Early Alert 2.0: Modernizing Campus Intervention Systems for University Student Success\nstudent-communication-strategies|2025-09-30|Nudges vs. Noise: Communicating Effectively with Today's Students\nstudent-engagement-strategies-gamification-in-higher-education|2025-09-25|Gamification in Higher Education: Do Small Rewards Boost Student Engagement?\nfirst-year-retention-strategies|2025-09-23|Orientation Is Not Enough: Sustaining First-Year Belonging All Year\nenrollment-cliff-2025-retention-strategies|2025-09-18|Beyond the Enrollment Cliff: 2025 Retention Strategies for Today and Beyond\nroi-of-student-success-programs|2025-09-16|Proving ROI: Measuring the Impact of Student Success Initiatives".split('\n').map(function (l) {
    var a = l.split('|');
    return { path: '/' + a[0] + '/', date: a[1], title: a[2], img: a[3] ? IMG + a[3] : '' };
  });
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MON3 = { Jan:1, Feb:2, Mar:3, Apr:4, May:5, Jun:6, Jul:7, Aug:8, Sep:9, Oct:10, Nov:11, Dec:12 };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function pad(n) { return ('0' + n).slice(-2); }
  function normPath(href) {
    var p; try { p = new URL(href, location.origin).pathname; } catch (e) { p = href; }
    return p.replace(/\/*$/, '/');
  }
  function slugToTitle(path) {
    return path.replace(/\//g, '').split('-').map(function (w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : w; }).join(' ');
  }
  function dateParts(iso) { var a = iso.split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; }
  function fmtDay(iso) { var p = dateParts(iso); return MONTHS[p.m - 1].slice(0, 3) + ' ' + p.d + ', ' + p.y; }

  // Read title / date / image from a post page (only used for posts newer than the bundled list).
  function hydrate(post) {
    var key = 'cm-post-v1:' + post.path, c = lsGet(key);
    if (c) { try { var o = JSON.parse(c); post.title = o.t || post.title; post.date = o.d || post.date; post.img = o.i || post.img; return Promise.resolve(post); } catch (e) {} }
    return fetch(post.path, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var h1 = doc.querySelector('h1'), og = doc.querySelector('meta[property="og:image"]'), tm = doc.querySelector('.g-post-date time');
        if (h1 && h1.textContent.trim()) post.title = h1.textContent.trim();
        if (og && og.content) post.img = og.content;
        var m = tm && tm.textContent.match(/([A-Za-z]{3})[a-z]*,?\s+(\d{1,2}),?\s+(\d{4})/);
        if (m && MON3[m[1]]) post.date = m[3] + '-' + pad(MON3[m[1]]) + '-' + pad(m[2]);
        lsSet(key, JSON.stringify({ t: post.title, d: post.date, i: post.img }));
        return post;
      })
      .catch(function () { return post; });
  }

  // Resolves to every post, newest first: bundled list + anything new found in the sitemap.
  function loadPosts(sitemapUrl) {
    var byPath = {};
    SEED.forEach(function (p) { byPath[p.path] = { path: p.path, date: p.date, title: p.title, img: p.img }; });
    return fetch(sitemapUrl, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (xml) {

          byPath[path] = { path: path, date: d, title: slugToTitle(path), img: '' };
          fresh.push(byPath[path]);
        }
        fresh.sort(function (a, b) { return b.date.localeCompare(a.date); });
        return Promise.all(fresh.slice(0, 20).map(hydrate));
      })
      .catch(function () {})
      .then(function () {
        return Object.keys(byPath).map(function (k) { return byPath[k]; })
          .sort(function (a, b) { return b.date.localeCompare(a.date); });
      });

  function el(tag, cls, text) {
    var n = document.createElement(tag);

    if (text != null) n.textContent = text;

  }

  function render(posts) {
    var groups = {}, order = [];
    posts.forEach(function (p) {
      var key = p.date.slice(0, 7);
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(p);
    });
    order.sort().reverse();

    var lastYear = null, first = null;
    order.forEach(function (key, idx) {
      var items = groups[key], year = key.slice(0, 4);
      if (year !== lastYear) { listEl.appendChild(el('div', 'cm-archive__year', year)); lastYear = year; }
      var d = document.createElement('details'), s = document.createElement('summary');

      var ul = document.createElement('ul');
      items.forEach(function (p) {
        var li = document.createElement('li'), a = document.createElement('a');
        a.href = p.path; a.textContent = p.title; li.appendChild(a);
        var t = document.createElement('time');
        t.setAttribute('datetime', p.date); t.textContent = fmtDay(p.date);
        li.appendChild(t); ul.appendChild(li);
      });
      d.appendChild(ul); listEl.appendChild(d);
      if (idx === 0) first = d;
    });
    if (OPEN_LATEST && first) first.open = true;
    statusEl.hidden = true;
  }

  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cm]');
    if (!b) return;
    var open = b.getAttribute('data-cm') === 'expand';
    Array.prototype.forEach.call(listEl.querySelectorAll('details'), function (d) { d.open = open; });
  });

  loadPosts(SITEMAP).then(render).catch(function () {
    statusEl.hidden = false;
    statusEl.innerHTML = 'Couldn’t load the archive. <a href="' + SITEMAP + '">Browse the sitemap</a>.';
  });
})();
</script>
